<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>ورود | Beeny Panel</title>
<style>
:root{font-family:Vazirmatn,Tahoma,Arial,sans-serif;color:#f3f8ff;background:#070e1c}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse 60% 65% at 13% 20%,#173b73 0%,transparent 70%),radial-gradient(ellipse 55% 65% at 95% 85%,#124c5d 0%,transparent 75%),#070e1c}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(184,222,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(184,222,255,.025) 1px,transparent 1px);background-size:40px 40px;mask-image:linear-gradient(120deg,transparent,#000)}.shell{position:relative;min-height:100vh;display:grid;place-items:center;padding:34px 16px}.card{width:min(100%,440px);border-radius:30px;padding:38px;background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.035));border:1px solid rgba(205,229,255,.19);box-shadow:0 32px 100px rgba(0,5,22,.42),inset 0 1px 0 rgba(255,255,255,.14);backdrop-filter:blur(28px)}.brand{display:flex;align-items:center;gap:12px;margin-bottom:43px;direction:ltr;justify-content:flex-end}.symbol{width:46px;height:46px;border-radius:15px;background:linear-gradient(140deg,#55e0ed,#658afa);display:grid;place-items:center;color:#061a37;box-shadow:0 12px 32px rgba(66,164,233,.32)}.brand strong{letter-spacing:.12em;font-size:16px}.brand small{display:block;letter-spacing:.08em;color:#b3cce3;font-size:10px;margin-top:4px}.tag{font-size:12px;color:#7fdbef;font-weight:700;letter-spacing:.06em;margin:0 0 10px}h1{font-size:30px;line-height:1.35;letter-spacing:-.04em;margin:0 0 9px}p.desc{color:#a9bcd1;font-size:13px;line-height:1.9;margin:0 0 31px}label{display:block;font-size:13px;font-weight:650;margin-bottom:9px}.field{margin:0 0 19px}input{width:100%;padding:15px 16px;border:1px solid rgba(199,224,255,.17);border-radius:13px;background:rgba(5,15,31,.45);outline:none;color:#fff;font:inherit;direction:ltr;text-align:left}input::placeholder{color:#788ea8}input:focus{border-color:#67d3ed;box-shadow:0 0 0 3px rgba(83,201,235,.14)}button{width:100%;padding:15px;border:0;border-radius:13px;background:linear-gradient(105deg,#54d4e9,#597ef0);color:#061329;font:inherit;font-weight:800;cursor:pointer;margin-top:12px;box-shadow:0 13px 30px rgba(57,133,213,.3)}button:hover{filter:brightness(1.1)}.error{border:1px solid rgba(255,120,141,.4);background:rgba(138,35,60,.24);padding:12px 15px;border-radius:12px;color:#ffd8df;font-size:13px;margin-bottom:17px}.foot{margin:30px 0 0;text-align:center;color:#8da4bc;font-size:11px;letter-spacing:.02em}@media(max-width:480px){.card{padding:29px 23px;border-radius:23px}h1{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head>
<body><main class="shell"><section class="card" aria-label="ورود به پنل">
 <div class="brand"><div><strong>BEENY</strong><small>CONTROL PANEL</small></div><div class="symbol" aria-hidden="true"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2 3 6v6c0 5 3.4 8.5 9 10 5.6-1.5 9-5 9-10V6l-9-4Z"/><path d="m8.5 12 2.4 2.4 4.8-5"/></svg></div></div>
 <p class="tag">SECURE ACCESS</p><h1>خوش آمدید</h1><p class="desc">برای مدیریت سرورها و حساب‌ها وارد پنل شوید.</p>
 {% if error %}<div class="error" role="alert">نام کاربری یا رمز عبور درست نیست.</div>{% endif %}
 <form method="post" action="{{ panel_path }}/login"><div class="field"><label for="username">نام کاربری</label><input id="username" name="username" autocomplete="username" required maxlength="64" autofocus placeholder="Username"></div><div class="field"><label for="password">رمز عبور</label><input id="password" type="password" name="password" autocomplete="current-password" required placeholder="Password"></div><button type="submit">ورود به پنل ←</button></form>
 <p class="foot">BEENY PANEL · ADMIN ACCESS</p>
</section></main></body></html>
