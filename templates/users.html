{% extends 'layout.html' %}{% block content %}
<link rel="stylesheet" href="{{ url_for('static',filename='css/customer-admin.css') }}">
<div class="customer-admin" id="account-list" data-api="{{ customer_base }}/api/users/search" data-base="{{ customer_base }}">
<div class="admin-page-title"><div><span class="overline">ACCOUNTS</span><h1>Your customers</h1><p>Search, sort and manage your accounts in one continuous list.</p></div><a class="admin-button primary" href="{{ customer_base }}/users/add">+ Create account</a></div>
<div class="user-filters"><input id="users-search" type="search" placeholder="Search username" aria-label="Search users"><select id="users-sort" aria-label="Sort users"><option value="name_asc">Name · A–Z</option><option value="name_desc">Name · Z–A</option><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="traffic_desc">Most data used</option><option value="traffic_asc">Least data used</option></select><select id="users-status" aria-label="Account status"><option value="">All statuses</option><option value="active">Active</option><option value="disabled">Disabled</option></select><select id="users-page-size" aria-label="Accounts per batch"><option value="100">100 per batch</option><option value="50">50 per batch</option><option value="200">200 per batch</option></select></div>
<p class="users-result" role="status"></p><div class="user-list"></div><button id="users-more" class="admin-button" type="button" hidden>Load more accounts</button>
</div><script src="{{ url_for('static',filename='js/users-list.js') }}" defer></script>
{% endblock %}
