<fieldset class="reseller-plan-picker"><legend>{{ 'Choose a service' if customer_language=='en' else 'سرویس خود را انتخاب کنید' }}</legend><label class="reseller-service-label"><span>{{ 'Service plan' if customer_language=='en' else 'پلن سرویس' }}</span><select name="plan_id" data-reseller-plan required>{% for plan in plans %}<option value="{{ plan.id }}" data-price="{{ plan.price }}" {% if loop.first %}selected{% endif %}>{{ (plan.title_en or (plan.days|string+'-day plan')) if customer_language=='en' else plan.title }} · {{ plan.days }} {{ 'days' if customer_language=='en' else 'روز' }} · {{ plan.quota }} GB · {{ '{:,}'.format(plan.price) }} {{ 'Toman' if customer_language=='en' else 'تومان' }}</option>{% endfor %}<option value="custom" {% if not plans %}selected{% endif %}>{{ 'Custom service' if customer_language=='en' else 'تنظیم دلخواه' }}</option></select></label><div class="admin-three-cols reseller-custom-fields"><label>روز اعتبار<input name="days" type="number" min="1" max="3650" value="30" required></label><label>حجم GB<input name="quota" type="number" min="1" max="100000" value="100" required></label><label>دستگاه<input name="devices" type="number" min="1" max="20" value="1" required></label></div><output class="reseller-price" data-reseller-total aria-live="polite"></output><small class="admin-hint">قیمت قطعی از سمت سرور و بر اساس تعرفهٔ مدیر محاسبه می‌شود.</small></fieldset>
