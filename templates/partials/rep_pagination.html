{% if pagination.pages>1 %}<nav class="commission-pagination" aria-label="صفحه‌بندی">{% if pagination.has_prev %}<a class="admin-button" href="{{ rep_page_url(pagination.prev_num,pagination_key if pagination_key is defined else 'page') }}">{{ 'Previous' if en is defined and en else 'قبلی' }}</a>{% endif %}<span>{{ pagination.page }} / {{ pagination.pages }}</span>{% if pagination.has_next %}<a class="admin-button" href="{{ rep_page_url(pagination.next_num,pagination_key if pagination_key is defined else 'page') }}">{{ 'Next' if en is defined and en else 'بعدی' }}</a>{% endif %}</nav>{% endif %}
