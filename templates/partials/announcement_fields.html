{% set item=announcement_item if announcement_item is defined else none %}
<div class="admin-two-cols"><label>{{ admin_t('Persian title') }}<input name="title" maxlength="120" required value="{{ item.title if item else '' }}"></label><label>{{ admin_t('English title') }}<input name="title_en" maxlength="120" value="{{ item.title_en if item else '' }}"></label><label>{{ admin_t('Persian message') }}<textarea name="body" maxlength="4000" required rows="3">{{ item.body if item else '' }}</textarea></label><label>{{ admin_t('English message') }}<textarea name="body_en" maxlength="4000" rows="3">{{ item.body_en if item else '' }}</textarea></label><label>{{ admin_t('Icon') }}<select name="icon">{% for value in ['info','bell','check','warning','gift','sparkles','maintenance'] %}<option value="{{ value }}" {% if item and item.icon==value %}selected{% endif %}>{{ value|title }}</option>{% endfor %}</select></label><label>{{ admin_t('Color') }}<select name="color">{% for value in ['blue','green','amber','rose','violet','slate'] %}<option value="{{ value }}" {% if item and item.color==value %}selected{% endif %}>{{ value|title }}</option>{% endfor %}</select></label></div>
