{% from 'partials/ui_icons.html' import icon %}
<div class="auth-controls">{% if customer %}<a class="auth-language" href="{{ auth_login_target|default(portal_base+'/login') }}?lang={{ 'fa' if customer_language=='en' else 'en' }}" aria-label="{{ 'فارسی' if customer_language=='en' else 'English' }}">{{ icon('globe') }}<span class="language-badge">{{ 'FA' if customer_language=='en' else 'EN' }}</span></a>{% else %}<a class="auth-language" href="{{ url_for('login',lang='fa' if auth_language=='en' else 'en') }}" aria-label="{{ 'فارسی' if auth_language=='en' else 'English' }}">{{ icon('globe') }}<span class="language-badge">{{ 'FA' if auth_language=='en' else 'EN' }}</span></a>{% endif %}<button class="auth-theme icon-button" id="auth-theme" type="button" aria-label="{{ 'تغییر تم' if auth_language=='fa' else 'Change theme' }}" aria-pressed="false"><span class="theme-sun">{{ icon('sun') }}</span><span class="theme-moon">{{ icon('moon') }}</span></button></div>
