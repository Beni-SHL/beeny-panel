<div class="notification-center" data-notifications="{{ notification_url }}" data-csrf="{{ customer_csrf() }}" data-locale="{{ notification_locale }}">
<button type="button" class="notification-bell glass-btn icon-button" aria-expanded="false" aria-label="{{ 'اعلان‌ها' if notification_locale == 'fa' else 'Notifications' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16.5V11a6 6 0 1 1 12 0v5.5l1.5 1.5h-15ZM10 20.5a2.2 2.2 0 0 0 4 0"/></svg><span class="notification-badge" hidden>0</span></button>
<section class="notification-popover" hidden aria-label="{{ 'اعلان‌ها' if notification_locale=='fa' else 'Notifications' }}"><header class="notification-feed-heading"><span class="notification-feed-mark" aria-hidden="true">{{ icon('notification') if icon is defined else '◉' }}</span><h3>{{ 'اعلان‌های شما' if notification_locale == 'fa' else 'Notifications' }}</h3><span class="notification-unread" hidden>0</span><button class="notification-close" type="button" aria-label="{{ 'بستن' if notification_locale=='fa' else 'Close' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button></header><div class="notification-actions"><button class="notification-read" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12.5 4.2 4.2L19 7"/></svg>{{ 'خواندن همه' if notification_locale == 'fa' else 'Read all' }}</button><button class="notification-clear notification-read" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg>{{ 'پاک‌کردن' if notification_locale == 'fa' else 'Clear' }}</button></div><div class="notification-items" role="list"></div><p class="notification-feedback" role="status" aria-live="polite"></p></section></div>
