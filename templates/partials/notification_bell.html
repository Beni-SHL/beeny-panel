<div class="notification-center" data-notifications="{{ notification_url }}" data-csrf="{{ customer_csrf() }}" data-locale="{{ notification_locale }}">
<button type="button" class="notification-bell" aria-expanded="false" aria-label="{{ 'اعلان‌ها' if notification_locale == 'fa' else 'Notifications' }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><span class="notification-badge" hidden>0</span></button>
<section class="notification-popover" hidden><h3>{{ 'اعلان‌های شما' if notification_locale == 'fa' else 'Notifications' }}</h3><div class="notification-items"></div><div class="notification-actions"><button class="notification-read" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 5 5L20 6"/></svg>{{ 'خواندم' if notification_locale == 'fa' else 'Mark as read' }}</button><button class="notification-clear notification-read" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg>{{ 'پاک‌کردن اعلان‌ها' if notification_locale == 'fa' else 'Clear notifications' }}</button></div></section></div>
