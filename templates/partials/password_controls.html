{% from 'partials/ui_icons.html' import icon %}<div class="ac-actions password-tools" style="margin-top:10px;flex-wrap:wrap" data-password-controls="portal_password">
  <button type="button" class="ac-btn ac-btn-subtle" data-password-generate>Generate password</button>
  {% if not profile_password_inline|default(false) %}<button type="button" class="ac-btn ac-btn-subtle" data-password-toggle aria-pressed="false" aria-label="Show password" title="Show password">{{ icon("eye") }}</button>{% endif %}
  <button type="button" class="ac-btn ac-btn-subtle" data-password-copy aria-label="Copy password" title="Copy password">{{ icon('copy') }}</button>
  <small class="ac-hint" data-password-status role="status" aria-live="polite"></small>
</div>
