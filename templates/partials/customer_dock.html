{% from 'partials/ui_icons.html' import icon %}
<nav class="account-dock expanding-tabs" data-account-home="{{ home }}" data-liquid-background="{{ 'true' if theme_config.customer.navigation.liquid_background else 'false' }}" data-liquid-buttons="{{ 'true' if theme_config.customer.navigation.liquid_buttons else 'false' }}" aria-label="{{ 'Account sections' if customer_language=='en' else 'بخش‌های حساب' }}">
{% for name in theme_config.customer.navigation['items'] %}{% set mark,fa,en=theme_nav_items[name] %}
<a href="{{ home ~ ('/' ~ name if name in ['tickets','wallet','devices'] else '#' ~ name) }}" data-dock-section="{{ name }}" aria-label="{{ en if customer_language=='en' else fa }}" {% if (name in ['tickets','wallet','devices'] and '/' ~ name in request.path) or (name=='renew' and '/renew' in request.path) or (name=='overview' and request.endpoint=='customer_portal') %}aria-current="page"{% endif %}>{{ icon(mark) }}<span class="dock-label">{{ en if customer_language=='en' else fa }}</span></a>
{% endfor %}</nav>
