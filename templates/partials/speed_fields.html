<div class="speed-policy-fields">
<div class="ac-field"><label>{{ admin_t('Service policy') }}</label><select name="{{ policy_prefix }}quota_mode"><option value="metered" {% if not policy or policy.quota_mode!='fair_use' %}selected{% endif %}>{{ admin_t('Fixed data · stop at limit') }}</option><option value="fair_use" {% if policy and policy.quota_mode=='fair_use' %}selected{% endif %}>{{ admin_t('Fair use · reduce speed at limit') }}</option></select></div>
<details class="speed-options" {% if policy and policy.quota_mode=='fair_use' %}open{% endif %}><summary>{{ admin_t('Speed after fair use') }}</summary><div class="ac-grid">
<div class="ac-field"><label>{{ admin_t('Download · kbit/s') }}</label><input type="number" name="{{ policy_prefix }}throttle_down_kbps" min="64" max="1000000" value="{{ policy.throttle_down_kbps or 2000 if policy else 2000 }}" required></div>
<div class="ac-field"><label>{{ admin_t('Upload · kbit/s') }}</label><input type="number" name="{{ policy_prefix }}throttle_up_kbps" min="64" max="1000000" value="{{ policy.throttle_up_kbps or 2000 if policy else 2000 }}" required></div></div><p class="ac-hint">{{ admin_t('2000 kbit/s = 2 Mbps. Fair use needs a positive GB allowance.') }}</p></details></div>
