{% extends "layout.html" %}

{% block content %}

<h2 class="mb-4">{{ admin_t('Edit User') }}</h2>

<div class="glass-card">

<form method="post" data-admin-ajax>

    <div class="mb-3">
        <label>{{ admin_t('Username') }}</label>

        <input
            name="username"
            value="{{ user.username }}"
            class="form-control">
    </div>

    <div class="mb-3">

        <label>{{ admin_t('Protocol') }}</label>

        <select
            name="protocol"
            class="form-control">

            <option value="openvpn"
            {% if user.protocol=="openvpn" %}
            selected
            {% endif %}>
            OpenVPN
            </option>

            <option value="wireguard"
            {% if user.protocol=="wireguard" %}
            selected
            {% endif %}>
            WireGuard
            </option>

        </select>

    </div>

    <div class="mb-3">

        <label>{{ admin_t('Max Devices') }}</label>

        <input
            type="number"
            name="max_devices"
            value="{{ user.max_devices }}"
            class="form-control">

    </div>

    <div class="mb-3">

        <label>{{ admin_t('Expire Date') }}</label>

        <input
            type="date"
            name="expire_date"
            value="{{ user.expire_date }}"
            class="form-control">

    </div>

    <div class="mb-3">

        <label>{{ admin_t('Status') }}</label>

        <select
            name="status"
            class="form-control">

            <option value="active"
            {% if user.status=="active" %}
            selected
            {% endif %}>
            {{ admin_t('Active') }}
            </option>

            <option value="disabled"
            {% if user.status=="disabled" %}
            selected
            {% endif %}>
            {{ admin_t('Disabled') }}
            </option>

        </select>

    </div>

    <button
        class="btn btn-success">
        {{ admin_t('Save Changes') }}
    </button>

</form>

</div>

{% endblock %}
