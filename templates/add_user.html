{% extends "layout.html" %}
{% block content %}

<style>
/* ???? ???????? Liquid Glass ???? ?????? */
.glass-form-card {
    background: rgba(255, 255, 255, 0.03);
    backdrop-filter: blur(32px) saturate(200%);
    -webkit-backdrop-filter: blur(32px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 32px;
    padding: 36px 40px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 20px 40px rgba(0, 0, 0, 0.2);
    max-width: 700px;
    margin: 0 auto;
}

.page-title {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    color: #fff;
    margin-bottom: 30px;
    text-align: center;
    letter-spacing: -1px;
}

.form-label {
    font-size: 13px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.7);
    margin-bottom: 8px;
    letter-spacing: 0.5px;
}

/* ?????????? ??????? */
.glass-input {
    background: rgba(0, 0, 0, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-top: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    padding: 12px 18px;
    color: #fff;
    font-size: 15px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.2);
    width: 100%;
}
.glass-input:focus {
    background: rgba(0, 0, 0, 0.25);
    border-color: rgba(96, 165, 250, 0.5);
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.2), 0 0 20px rgba(96, 165, 250, 0.15);
    outline: none;
}

.glass-input::placeholder { color: rgba(255,255,255,0.2); }
.glass-input option { background: #111; color: #fff; }

.helper-text {
    font-size: 11px; color: rgba(255, 255, 255, 0.4); margin-top: 6px; display: block;
}

/* ??????? ????? */
.nodes-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 12px;
}
.node-checkbox {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 14px 18px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer; transition: all 0.2s;
}
.node-checkbox:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.15); }
.node-checkbox input[type="checkbox"] {
    width: 20px; height: 20px; border-radius: 6px; appearance: none; -webkit-appearance: none;
    border: 1px solid rgba(255,255,255,0.3); background: rgba(0,0,0,0.2); outline: none; cursor: pointer;
    position: relative; transition: all 0.2s;
}
.node-checkbox input[type="checkbox"]:checked {
    background: #4ade80; border-color: #4ade80; box-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
}
.node-checkbox input[type="checkbox"]:checked::after {
    content: '?'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    color: #000; font-size: 12px; font-weight: bold;
}
.node-label { color: rgba(255,255,255,0.9); font-weight: 500; font-size: 14px; cursor: pointer; }

/* ???????? ???? */
.action-buttons { display: flex; gap: 14px; margin-top: 40px; }
.btn-primary-glass {
    flex: 1; padding: 14px; border-radius: 16px; font-weight: 600; font-size: 15px; border: none;
    background: linear-gradient(135deg, rgba(96,165,250,0.2), rgba(59,130,246,0.1));
    border: 1px solid rgba(96,165,250,0.3); border-top: 1px solid rgba(96,165,250,0.5);
    color: #93c5fd; cursor: pointer; transition: all 0.3s;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 20px rgba(59,130,246,0.15);
}
.btn-primary-glass:hover {
    transform: translateY(-2px); background: linear-gradient(135deg, rgba(96,165,250,0.3), rgba(59,130,246,0.2));
    color: #fff; border-color: rgba(96,165,250,0.6);
}
.btn-cancel-glass {
    padding: 14px 28px; border-radius: 16px; font-weight: 600; font-size: 15px; text-decoration: none;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.6); display: flex; align-items: center; justify-content: center; transition: all 0.3s;
}
.btn-cancel-glass:hover { background: rgba(255,255,255,0.1); color: #fff; }

@media (max-width: 600px) {
    .glass-form-card { padding: 24px; border-radius: 24px; }
    .action-buttons { flex-direction: column; }
}
</style>

<h2 class="page-title">Create New User</h2>

<div class="glass-form-card">
    <form method="post">
        
        <div class="row" style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="glass-input" placeholder="e.g. jondoe" required>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Protocol</label>
                <select name="protocol" class="glass-input">
                    <option value="openvpn">OpenVPN</option>
                    <option value="wireguard">WireGuard</option>
                </select>
            </div>
        </div>

        <div class="row" style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Max Devices</label>
                <input type="number" name="max_devices" value="1" min="1" class="glass-input">
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Traffic Limit (GB)</label>
                <input type="number" step="0.1" min="0" value="10" name="traffic_limit" class="glass-input">
                <span class="helper-text">Set 0 for Unlimited traffic</span>
            </div>
        </div>

        <div class="mb-4" style="margin-bottom: 30px;">
            <label class="form-label">Expire Date</label>
            <input type="date" name="expire_date" class="glass-input">
        </div>

        <div class="nodes-section">
            <label class="form-label" style="font-size: 15px; color: #fff; display: flex; align-items: center; gap: 8px;">
                <i class="fa fa-globe" style="color: #60a5fa;"></i> Select Allowed Nodes
            </label>
            <div class="nodes-grid">
                {% for node in nodes %}
                <label class="node-checkbox">
                    <input type="checkbox" name="nodes" value="{{ node.id }}" checked>
                    <span class="node-label">{{ node.name }} <small style="opacity: 0.5;">({{ node.country }})</small></span>
                </label>
                {% endfor %}
            </div>
            {% if not nodes %}
            <div style="background: rgba(251, 191, 36, 0.1); border: 1px solid rgba(251, 191, 36, 0.3); color: #fbbf24; border-radius: 12px; padding: 14px; margin-top: 10px; font-size: 13px;">
                ?? No nodes found. Please add a node in the settings first.
            </div>
            {% endif %}
        </div>

        <div class="action-buttons">
            <button type="submit" class="btn-primary-glass">
                <i class="fa fa-check" style="margin-right: 6px;"></i> Create User
            </button>
            <a href="{{ panel_path }}/users" class="btn-cancel-glass">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
