{% extends "layout.html" %}
{% block content %}

<style>
.glass-form-card {
    background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(32px) saturate(200%); -webkit-backdrop-filter: blur(32px) saturate(200%);
    border: 1px solid rgba(255, 255, 255, 0.08); border-top: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 32px; padding: 36px 40px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 20px 40px rgba(0, 0, 0, 0.2);
    max-width: 700px; margin: 0 auto;
}
.page-title { font-family: 'Syne', sans-serif; font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 30px; text-align: center; letter-spacing: -1px; }
.form-label { font-size: 13px; font-weight: 600; color: rgba(255, 255, 255, 0.7); margin-bottom: 8px; display: block;}
.glass-input {
    background: rgba(0, 0, 0, 0.15); border: 1px solid rgba(255, 255, 255, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 16px; padding: 12px 18px; color: #fff; font-size: 15px; transition: all 0.3s; box-shadow: inset 0 2px 6px rgba(0,0,0,0.2); width: 100%;
}
.glass-input:focus { background: rgba(0, 0, 0, 0.25); border-color: rgba(96, 165, 250, 0.5); box-shadow: inset 0 2px 6px rgba(0,0,0,0.2), 0 0 20px rgba(96, 165, 250, 0.15); outline: none; }
.glass-input option { background: #111; color: #fff; }
.helper-text { font-size: 11px; color: rgba(255, 255, 255, 0.4); margin-top: 6px; display: block; }
.action-buttons { display: flex; gap: 14px; margin-top: 40px; }
.btn-primary-glass {
    flex: 1; padding: 14px; border-radius: 16px; font-weight: 600; font-size: 15px; border: none;
    background: linear-gradient(135deg, rgba(74,222,128,0.15), rgba(34,197,94,0.1));
    border: 1px solid rgba(74,222,128,0.3); border-top: 1px solid rgba(74,222,128,0.5);
    color: #4ade80; cursor: pointer; transition: all 0.3s; box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 8px 20px rgba(34,197,94,0.1);
}
.btn-primary-glass:hover { transform: translateY(-2px); background: linear-gradient(135deg, rgba(74,222,128,0.25), rgba(34,197,94,0.15)); color: #fff; border-color: rgba(74,222,128,0.6); }
.btn-cancel-glass { padding: 14px 28px; border-radius: 16px; font-weight: 600; text-decoration: none; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); display: flex; align-items: center; transition: all 0.3s; }
.btn-cancel-glass:hover { background: rgba(255,255,255,0.1); color: #fff; }
@media (max-width: 600px) { .glass-form-card { padding: 24px; border-radius: 24px; } .action-buttons { flex-direction: column; } }
</style>

<h2 class="page-title">Edit User Profile</h2>

<div class="glass-form-card">
    <form method="post">
        
        <div class="row" style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Username</label>
                <input type="text" name="username" value="{{ user.username }}" class="glass-input" required>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Protocol</label>
                <select name="protocol" class="glass-input">
                    <option value="openvpn" {% if user.protocol == "openvpn" %}selected{% endif %}>OpenVPN</option>
                    <option value="wireguard" {% if user.protocol == "wireguard" %}selected{% endif %}>WireGuard</option>
                </select>
            </div>
        </div>

        <div class="row" style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px;">
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Max Devices</label>
                <input type="number" name="max_devices" value="{{ user.max_devices }}" min="1" class="glass-input" required>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Traffic Limit (GB)</label>
                <input type="number" step="0.1" min="0" name="traffic_limit" value="{{ user.traffic_limit }}" class="glass-input">
                <span class="helper-text">0 = Unlimited</span>
            </div>
        </div>

        <div class="row" style="display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 30px;">
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Expire Date</label>
                <input type="date" name="expire_date" value="{{ user.expire_date }}" class="glass-input">
                <span class="helper-text">Leave empty or '-' for no expiration</span>
            </div>
            <div style="flex: 1; min-width: 200px;">
                <label class="form-label">Status</label>
                <select name="status" class="glass-input">
                    <option value="active" {% if user.status == "active" %}selected{% endif %}>í ½í¿¢ Active</option>
                    <option value="disabled" {% if user.status == "disabled" %}selected{% endif %}>í ½í´´ Disabled</option>
                </select>
            </div>
        </div>

        <div class="action-buttons">
            <button type="submit" class="btn-primary-glass">
                <i class="fa fa-save" style="margin-right: 6px;"></i> Save Changes
            </button>
            <a href="{{ panel_path }}/users" class="btn-cancel-glass">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
